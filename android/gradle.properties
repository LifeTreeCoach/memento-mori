org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 opt-outs, both still required (checked with Flutter 3.47.9, AGP 9.1.0 and 9.4.1, Kotlin 2.4.0):
# - newDsl=true breaks the Flutter Gradle plugin itself while applying to :app:
#   "ApplicationExtensionImpl$AgpDecorated_Decorated cannot be cast to
#   com.android.build.gradle.AbstractAppExtension" (Flutter issue #184839, old-DSL types).
#   kotlin-android (applied by the plugins below) is incompatible with the new DSL as well.
# - builtInKotlin=true fails on projects that apply kotlin-android themselves: "Failed to apply
#   plugin 'org.jetbrains.kotlin.android' ... no longer required for Kotlin support since AGP 9.0".
#   device_calendar 4.3.3 did; its replacement device_calendar_plus uses built-in Kotlin, and
#   home_widget 0.10.0, package_info_plus 10.2.2, share_plus 13.3.1, flutter_timezone 5.1.1 and
#   android_file_picker 2.1.3 apply it only while android.builtInKotlin=false (checked in their
#   android/build.gradle[.kts]). Checked 2026-11: with true, only our own :wear (wear/build.gradle
#   applies org.jetbrains.kotlin.android) still fails. Flip to true once :wear (and :app) migrate
#   to built-in Kotlin (and drop newDsl once Flutter supports it).
android.newDsl=false
android.builtInKotlin=false
