// Native Wear OS app: Compose screen, Tile and complication. Receives the widget contract inputs
// from the phone over the Wearable Data Layer and computes everything with :lifecore.
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

// Same release key as the phone app (required by the Data Layer): see ../signing.gradle.
apply from: "../signing.gradle"

// Version from pubspec.yaml (`version: <name>+<build>`), like the phone app. Phone and watch APKs
// share one applicationId and Play listing, so each needs its own versionCode: the watch uses the
// phone's build number + 100000 (phone 1 -> watch 100001), so the two never collide.
def pubspecVersion = {
    def versionLine = rootProject.file("../pubspec.yaml").readLines().find { it.startsWith("version:") }
    def match = versionLine =~ /^version:\s*([^+\s]+)\+(\d+)/
    if (!match.find()) {
        throw new GradleException("pubspec.yaml: expected `version: <name>+<build>`, got: $versionLine")
    }
    return [name: match.group(1), build: match.group(2).toInteger()]
}()
def wearVersionCodeOffset = 100000

android {
    namespace = "lifetree.coach.memento_mori_life_in_weeks.wear"
    compileSdk = 37

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // Must equal the phone app's applicationId (and signing key) for the Data Layer.
        applicationId = "lifetree.coach.memento_mori_life_in_weeks"
        minSdk = 30
        // Wear OS 7 = API 37; its target-gated changes (MessageQueue, static finals, BAL)
        // don't touch the watch app. Wear OS 6 (API 36) runs it unchanged.
        targetSdk = 37
        versionCode = wearVersionCodeOffset + pubspecVersion.build
        versionName = pubspecVersion.name
    }

    buildFeatures {
        compose = true
    }

    buildTypes {
        release {
            // signingConfig comes from ../signing.gradle.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"))
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Shared life calculation + contract input model (pure Kotlin/JVM)
    implementation project(':lifecore')

    // Compose for Wear OS
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.wear.compose:compose-material3:1.7.1'
    implementation 'androidx.wear.compose:compose-foundation:1.7.1'

    // Tile + complication data source
    implementation 'androidx.wear.tiles:tiles:1.6.2'
    implementation 'androidx.wear.protolayout:protolayout:1.4.2'
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.3.0'
    implementation 'androidx.concurrent:concurrent-futures:1.3.0'

    // Wearable Data Layer (inputs from the phone)
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    testImplementation 'junit:junit:4.13.2'
}
