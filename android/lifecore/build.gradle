// Pure Kotlin/JVM life-calculation core shared by all Android targets (widget, later Wear OS).
// No Android APIs here, so its tests run on the plain JVM.
plugins {
    id "org.jetbrains.kotlin.jvm"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

tasks.named("test") {
    // Shared Dart/Kotlin/Swift LifeCalculator vectors (see docs/widget-data-contract.md).
    systemProperty 'lifeCalculatorVectors',
            file('../../test/fixtures/life_calculator_vectors.json').absolutePath
}
